name: Linux build and tests
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf dbus
      - run: npm ci
      - run: npm test && npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets
      - run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dead-air-linux-packages
          path: src-tauri/target/release/bundle/
